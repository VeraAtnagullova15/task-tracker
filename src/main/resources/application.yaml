spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: task-tracker-backend

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect



server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  lifetime: 90

